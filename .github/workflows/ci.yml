name: ci
on: [push, pull_request]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # ubuntu-24.04, not -latest: the newer image has no Python 3.9 build for setup-python.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m unittest discover -s tests
      - name: The healthy example passes and the drifted one fails
        run: |
          python -m mandata examples/healthy
          ! python -m mandata examples/drifted
